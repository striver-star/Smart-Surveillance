[project]
name = "hss-probe"
version = "0.1.0"
description = "Hikvision NVR capability probe (read-only) and stream settings tool for the HSS proof of concept"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hss-probe = "hss_probe.cli:main"
hss-streams = "hss_probe.streams:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hss_probe"]
