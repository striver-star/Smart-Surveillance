# Stream gateway. Each camera stream is pulled once and fanned out to viewers.
# Paths are added by the platform in Phase 2; one test path is shown commented out.
logLevel: info
api: yes
apiAddress: :9997
rtsp: yes
rtmp: no
srt: no
rtspAddress: :8554
hls: yes
hlsAddress: :8888
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

# Who may do what. Same as MediaMTX's defaults, except that the API (port 9997) answers any
# container on the Docker network, so the console can list cameras. Port 9997 is never published
# outside Docker in compose.yaml, so the site network can't reach it. Publishing and reading stay
# as before (to be tightened in Phase 2).
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: any
    pass:
    ips: []
    permissions:
      - action: api
      - action: metrics

# Pull camera video over TCP: UDP loses packets (broken frames) when the network or server is busy.
pathDefaults:
  rtspTransport: tcp

paths:
  # nvr1-ch1-sub:
  #   source: rtsp://USER:PASSWORD@NVR_IP:554/Streaming/Channels/102
  #   sourceOnDemand: yes
  all_others:
