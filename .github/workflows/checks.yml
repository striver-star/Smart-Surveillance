name: checks
on:
  push:
  pull_request:

jobs:
  licence-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-go@v5
        with: {go-version: "1.24"}
      - run: python -m pip install pytest
      - run: python -m pytest -q tools/licence-scan/test_scan.py
      - name: Licence scan (fails on a disallowed or unknown licence)
        run: python tools/licence-scan/scan.py --out sbom-out
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: sbom, path: sbom-out}

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: API
        run: |
          python -m pip install -r services/api/requirements.txt pytest
          cd services/api && python -m pytest -q
      - name: AI worker
        run: |
          python -m pip install -r services/ai-worker/requirements.txt pytest
          cd services/ai-worker && python -m pytest -q
      - name: Probe and stream tool
        run: |
          python -m pip install -e "tools/probe[test]"
          cd tools/probe && python -m pytest -q

  wall-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.24"}
      - run: cd services/wall-agent && go vet ./... && go test ./... && GOOS=windows go build ./...

  whatsapp-gateway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: cd services/whatsapp-gateway && PUPPETEER_SKIP_DOWNLOAD=1 npm ci && npm test
