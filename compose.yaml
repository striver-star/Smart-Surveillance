# Step 0 skeleton: database, API, stream gateway and reverse proxy.
# Later steps add the event service, AI workers, Traccar and the report service.
name: hss

services:
  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./services/api
    restart: unless-stopped
    environment:
      HSS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HSS_TZ: ${HSS_TZ}
      HSS_WORKER_TOKEN: ${HSS_WORKER_TOKEN}
      HSS_WALL_TOKEN: ${HSS_WALL_TOKEN}
      HSS_ADMIN_TOKEN: ${HSS_ADMIN_TOKEN}
      # Notifications: WhatsApp gateway (provider A), e-mail fallback, push (ntfy)
      HSS_WA_URL: http://whatsapp:3000
      HSS_WA_TOKEN: ${HSS_WA_TOKEN:-}
      HSS_SMTP_HOST: ${HSS_SMTP_HOST:-}
      HSS_SMTP_PORT: ${HSS_SMTP_PORT:-587}
      HSS_SMTP_USER: ${HSS_SMTP_USER:-}
      HSS_SMTP_PASSWORD: ${HSS_SMTP_PASSWORD:-}
      HSS_SMTP_FROM: ${HSS_SMTP_FROM:-}
      HSS_SMTP_STARTTLS: ${HSS_SMTP_STARTTLS:-true}
      HSS_NTFY_URL: http://ntfy:80
      HSS_NTFY_TOPIC: ${HSS_NTFY_TOPIC:-}
      HSS_NOTIFY_DAILY_TEST: ${HSS_NOTIFY_DAILY_TEST:-}
      # Scheduled reports: e.g. 07:00 (empty = off); daily every day, weekly Mondays, monthly on the 1st
      HSS_REPORT_TIME: ${HSS_REPORT_TIME:-}
      HSS_REPORT_KINDS: ${HSS_REPORT_KINDS:-daily,weekly,monthly,compliance}
      HSS_REPORT_FORMATS: ${HSS_REPORT_FORMATS:-pdf}
      HSS_RECIPIENTS: /config/recipients.json
      HSS_GATEWAY_API: http://gateway:9997
      HSS_PROBE_DIR: /probe
      # Key that encrypts NVR passwords (empty = a key file in the api-data volume). Back it up.
      HSS_VAULT_KEY: ${HSS_VAULT_KEY:-}
      # Days sealed evidence is kept (packages on legal hold are kept until the hold is removed)
      HSS_EVIDENCE_DAYS: ${HSS_EVIDENCE_DAYS:-365}
      # Guard phones and trackers: minutes without a position before "offline", and low battery %
      HSS_UNIT_OFFLINE_MIN: ${HSS_UNIT_OFFLINE_MIN:-10}
      HSS_UNIT_LOW_BATTERY: ${HSS_UNIT_LOW_BATTERY:-15}
      # Retention: days events and GPS positions are kept, and days of NVR video each camera must hold
      HSS_EVENT_DAYS: ${HSS_EVENT_DAYS:-365}
      HSS_POSITION_DAYS: ${HSS_POSITION_DAYS:-30}
      HSS_RECORDING_DAYS: ${HSS_RECORDING_DAYS:-30}
      # Days the viewing log (who watched which camera) is kept
      HSS_VIEW_LOG_DAYS: ${HSS_VIEW_LOG_DAYS:-365}
      # Days face and plate match records are kept (unless their alert is still open)
      HSS_RECOGNITION_DAYS: ${HSS_RECOGNITION_DAYS:-30}
      # The server's own LAN address: Devices › Find devices starts from its network
      HSS_SERVER_IP: ${HSS_SERVER_IP:-}
    volumes:
      - api-data:/data
      # Latest hss-probe / hss-cameras results, shown on the console's Devices page (read-only).
      - ${HSS_PROBE_OUTPUT:-./tools/probe/probe-output}:/probe:ro
      - ./config:/config:ro
      - ./dist/wall-agent:/srv/wall-agent:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    image: bluenviron/mediamtx:1.9.3
    restart: unless-stopped
    volumes:
      - ./gateway/mediamtx.yml:/mediamtx.yml:ro
    environment:
      # LAN address of this server, so wall PCs can receive WebRTC video (ICE candidate).
      MTX_WEBRTCADDITIONALHOSTS: ${HSS_SERVER_IP:-127.0.0.1}
    env_file:
      - path: gateway/cameras.env
        required: false
    ports:
      - "8189:8189/udp"   # WebRTC media (ICE)

  ai-worker:
    # Tier S analytics for non-AI cameras. Start with: docker compose --profile ai up -d
    profiles: ["ai"]
    build: ./services/ai-worker
    restart: unless-stopped
    environment:
      HSS_API_URL: http://api:8000
      HSS_WORKER_TOKEN: ${HSS_WORKER_TOKEN}
      HSS_MODEL_PATH: /models/${HSS_MODEL:-yolox_s.onnx}
      HSS_WORKER_CONFIG: /config/worker.json
      HSS_TZ: ${HSS_TZ}
    volumes:
      - ./models:/models:ro
      - ${HSS_WORKER_CONFIG_FILE:-./config/worker.json}:/config/worker.json:ro
    depends_on:
      api:
        condition: service_healthy
      gateway:
        condition: service_started

  attributes:
    # Smart search: people and vehicles, and their colours, in each event's picture. Starts with the AI worker:
    # docker compose --profile ai up -d
    profiles: ["ai"]
    build: ./services/ai-worker
    command: ["python", "-m", "worker.attributes"]
    restart: unless-stopped
    environment:
      HSS_API_URL: http://api:8000
      HSS_WORKER_TOKEN: ${HSS_WORKER_TOKEN}
      HSS_MODEL_PATH: /models/${HSS_MODEL:-yolox_s.onnx}
    volumes:
      - ./models:/models:ro
    depends_on:
      api:
        condition: service_healthy

  recognition:
    # Face and plate recognition (stage 4), on the cameras approved in the console (Face & plate). It runs only
    # while the legal review is in force, and sends matches only. Start with: docker compose --profile recognition up -d
    profiles: ["recognition"]
    build: ./services/ai-worker
    command: ["python", "-m", "worker.recognition"]
    restart: unless-stopped
    environment:
      HSS_API_URL: http://api:8000
      HSS_WORKER_TOKEN: ${HSS_WORKER_TOKEN}
      HSS_MODELS_DIR: /models
      HSS_RTSP_BASE: rtsp://gateway:8554
      HSS_RECOGNITION_FPS: ${HSS_RECOGNITION_FPS:-3}
      HSS_TZ: ${HSS_TZ}
    volumes:
      - ./models:/models:ro
    depends_on:
      api:
        condition: service_healthy
      gateway:
        condition: service_started

  edge:
    # NVR events, device health every minute and clips (Phase 3 part B). Start with: --profile edge
    profiles: ["edge"]
    build: ./services/edge
    restart: unless-stopped
    environment:
      HSS_API_URL: http://api:8000
      HSS_WORKER_TOKEN: ${HSS_WORKER_TOKEN}
      HSS_TZ: ${HSS_TZ:-Africa/Lagos}
      # NVRs come from the console (Devices, Add NVR); these three are only a fallback while it has none.
      HSS_NVRS: ${HSS_NVRS:-}
      HSS_NVR_USER: ${HSS_NVR_USER:-}
      HSS_NVR_PASSWORD: ${HSS_NVR_PASSWORD:-}
      HSS_EDGE_IGNORE: ${HSS_EDGE_IGNORE:-vmd,motiondetection}
    volumes:
      - edge-data:/data
    depends_on:
      - api

  traccar:
    # GPS (Phase 5): guard phones (Traccar Client app) and trackers report here; positions go to HSS.
    # Start with: --profile geo. Phones send to http://SERVER_IP:5055 (docs/gps.md).
    profiles: ["geo"]
    image: traccar/traccar:6.16.0-alpine
    restart: unless-stopped
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      FORWARD_URL: http://api:8000/geo/traccar?token=${HSS_WORKER_TOKEN}
    volumes:
      - ./gps/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar-data:/opt/traccar/data
      - traccar-logs:/opt/traccar/logs
    ports:
      - "5055:5055"     # OsmAnd protocol (Traccar Client)
    depends_on:
      - api

  whatsapp:
    # WhatsApp gateway (provider A). Start with: docker compose --profile notify up -d
    # Link once: docker compose logs -f whatsapp, then scan the QR code with the dedicated phone.
    profiles: ["notify"]
    build: ./services/whatsapp-gateway
    restart: unless-stopped
    environment:
      HSS_WA_TOKEN: ${HSS_WA_TOKEN:-}
    volumes:
      - wa-data:/data
    shm_size: 256m

  ntfy:
    # Self-hosted push notifications: phones subscribe in the ntfy app to http://SERVER_IP:8090/<topic>.
    profiles: ["notify"]
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: http://${HSS_SERVER_IP:-127.0.0.1}:8090
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
    volumes:
      - ntfy-cache:/var/cache/ntfy
    ports:
      - "8090:80"

  proxy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    environment:
      HSS_HOSTNAME: ${HSS_HOSTNAME}
      HSS_SERVER_IP: ${HSS_SERVER_IP:-127.0.0.1}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/wall-test:/srv/wall-test:ro
      - ./web/console:/srv/console:ro
      - ./dist/wall-agent:/srv/wall-agent:ro
      - caddy-data:/data
    depends_on:
      - api
      - gateway

volumes:
  traccar-data:
  traccar-logs:
  edge-data:
  wa-data:
  ntfy-cache:
  api-data:
  db-data:
  caddy-data:
