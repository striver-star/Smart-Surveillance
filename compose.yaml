# Step 0 skeleton: database, API, stream gateway and reverse proxy.
# Later steps add the event service, AI workers, Traccar and the report service.
name: hss

services:
  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./services/api
    restart: unless-stopped
    environment:
      HSS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HSS_TZ: ${HSS_TZ}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    image: bluenviron/mediamtx:1.9.3
    restart: unless-stopped
    volumes:
      - ./gateway/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8189:8189/udp"   # WebRTC media (ICE)

  proxy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    environment:
      HSS_HOSTNAME: ${HSS_HOSTNAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api
      - gateway

volumes:
  db-data:
  caddy-data:
