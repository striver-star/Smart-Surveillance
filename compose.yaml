# Step 0 skeleton: database, API, stream gateway and reverse proxy.
# Later steps add the event service, AI workers, Traccar and the report service.
name: hss

services:
  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./services/api
    restart: unless-stopped
    environment:
      HSS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HSS_TZ: ${HSS_TZ}
      HSS_WORKER_TOKEN: ${HSS_WORKER_TOKEN}
      HSS_WALL_TOKEN: ${HSS_WALL_TOKEN}
      HSS_ADMIN_TOKEN: ${HSS_ADMIN_TOKEN}
      # Notifications: WhatsApp gateway (provider A), e-mail fallback, push (ntfy)
      HSS_WA_URL: http://whatsapp:3000
      HSS_WA_TOKEN: ${HSS_WA_TOKEN:-}
      HSS_SMTP_HOST: ${HSS_SMTP_HOST:-}
      HSS_SMTP_PORT: ${HSS_SMTP_PORT:-587}
      HSS_SMTP_USER: ${HSS_SMTP_USER:-}
      HSS_SMTP_PASSWORD: ${HSS_SMTP_PASSWORD:-}
      HSS_SMTP_FROM: ${HSS_SMTP_FROM:-}
      HSS_SMTP_STARTTLS: ${HSS_SMTP_STARTTLS:-true}
      HSS_NTFY_URL: http://ntfy:80
      HSS_NTFY_TOPIC: ${HSS_NTFY_TOPIC:-}
      HSS_NOTIFY_DAILY_TEST: ${HSS_NOTIFY_DAILY_TEST:-}
      HSS_RECIPIENTS: /config/recipients.json
    volumes:
      - api-data:/data
      - ./config:/config:ro
      - ./dist/wall-agent:/srv/wall-agent:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    image: bluenviron/mediamtx:1.9.3
    restart: unless-stopped
    volumes:
      - ./gateway/mediamtx.yml:/mediamtx.yml:ro
    environment:
      # LAN address of this server, so wall PCs can receive WebRTC video (ICE candidate).
      MTX_WEBRTCADDITIONALHOSTS: ${HSS_SERVER_IP:-127.0.0.1}
    env_file:
      - path: gateway/cameras.env
        required: false
    ports:
      - "8189:8189/udp"   # WebRTC media (ICE)

  ai-worker:
    # Tier S analytics for non-AI cameras. Start with: docker compose --profile ai up -d
    profiles: ["ai"]
    build: ./services/ai-worker
    restart: unless-stopped
    environment:
      HSS_API_URL: http://api:8000
      HSS_WORKER_TOKEN: ${HSS_WORKER_TOKEN}
      HSS_MODEL_PATH: /models/${HSS_MODEL:-yolox_s.onnx}
      HSS_WORKER_CONFIG: /config/worker.json
      HSS_TZ: ${HSS_TZ}
    volumes:
      - ./models:/models:ro
      - ${HSS_WORKER_CONFIG_FILE:-./config/worker.json}:/config/worker.json:ro
    depends_on:
      api:
        condition: service_healthy
      gateway:
        condition: service_started

  whatsapp:
    # WhatsApp gateway (provider A). Start with: docker compose --profile notify up -d
    # Link once: docker compose logs -f whatsapp, then scan the QR code with the dedicated phone.
    profiles: ["notify"]
    build: ./services/whatsapp-gateway
    restart: unless-stopped
    environment:
      HSS_WA_TOKEN: ${HSS_WA_TOKEN:-}
    volumes:
      - wa-data:/data
    shm_size: 256m

  ntfy:
    # Self-hosted push notifications: phones subscribe in the ntfy app to http://SERVER_IP:8090/<topic>.
    profiles: ["notify"]
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: http://${HSS_SERVER_IP:-127.0.0.1}:8090
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
    volumes:
      - ntfy-cache:/var/cache/ntfy
    ports:
      - "8090:80"

  proxy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    environment:
      HSS_HOSTNAME: ${HSS_HOSTNAME}
      HSS_SERVER_IP: ${HSS_SERVER_IP:-127.0.0.1}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/wall-test:/srv/wall-test:ro
      - ./dist/wall-agent:/srv/wall-agent:ro
      - caddy-data:/data
    depends_on:
      - api
      - gateway

volumes:
  wa-data:
  ntfy-cache:
  api-data:
  db-data:
  caddy-data:
